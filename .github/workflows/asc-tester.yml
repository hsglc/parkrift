name: TestFlight tester

on:
  workflow_dispatch:
    inputs:
      email:
        description: Tester email
        required: true
      first:
        description: First name
        default: ""
      last:
        description: Last name
        default: ""

jobs:
  add:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || '668Y8934S8' }}
      ASC_ISSUER_ID: 1e043955-17da-4831-838a-b4e2d593d0b5
      BUNDLE_ID: com.huseyingulcu.hop
    steps:
      # The tester's details are read from the event file and masked, so they never show in
      # the (public) logs
      - name: Read and mask the tester
        run: |
          for KEY in email first last; do
            VALUE=$(jq -r ".inputs.$KEY // \"\"" "$GITHUB_EVENT_PATH")
            [ -n "$VALUE" ] && echo "::add-mask::$VALUE"
            NAME=$(echo "$KEY" | sed 's/email/EMAIL/;s/first/FIRST_NAME/;s/last/LAST_NAME/')
            echo "$NAME=$VALUE" >> "$GITHUB_ENV"
          done
      - uses: actions/checkout@v4
      - name: Write key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/key.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/key.p8" >> "$GITHUB_ENV"
      - run: pip install pyjwt cryptography requests
      - run: python3 tools/asc_tester.py

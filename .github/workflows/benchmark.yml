name: Benchmark (iOS Simulator)

on:
  workflow_dispatch:
  push:
    branches: [bench]

permissions:
  contents: write

jobs:
  bench:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for simulator (Release)
        run: |
          set -o pipefail
          xcodebuild -project Hop.xcodeproj -scheme Hop -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || {
              grep -E "error:" build.log | head -40 | while read -r line; do echo "::error::$line"; done
              exit 1
            }

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"]:
                      best = (runtime, d["udid"], d["name"])
          print(best[1] if best else "")
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          NAME=$(xcrun simctl list devices | grep "$UDID" | head -1 | sed 's/ (.*//' | xargs)
          echo "::notice title=device::$NAME ($UDID)"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/Hop.app

      - name: Run benchmarks
        run: |
          mkdir -p results
          run() {
            local label=$1; shift
            xcrun simctl terminate "$UDID" com.huseyingulcu.hop 2>/dev/null || true
            sleep 2
            xcrun simctl launch --console-pty "$UDID" com.huseyingulcu.hop -benchmark "$@" > "results/$label.log" 2>&1 &
            local pid=$!
            # Screenshot after the measurement (the app waits 5 s before quitting)
            DATA=$(xcrun simctl get_app_container "$UDID" com.huseyingulcu.hop data)
            rm -f "$DATA/Documents/bench.json"
            for i in $(seq 1 90); do [ -f "$DATA/Documents/bench.json" ] && break; sleep 1; done
            xcrun simctl io "$UDID" screenshot "results/$label.png" || true
            cp "$DATA/Documents/shot-start.png" "results/$label-start.png" 2>/dev/null || true
            cp "$DATA/Documents/shot-mid.png" "results/$label-mid.png" 2>/dev/null || true
            cp "$DATA/Documents/shot-hud.png" "results/$label-hud.png" 2>/dev/null || true
            cp "$DATA/Documents/menu.png" "results/$label-menu.png" 2>/dev/null || true
            cp "$DATA/Documents/shot-nitro.png" "results/$label-nitro.png" 2>/dev/null || true
            for i in $(seq 1 20); do kill -0 $pid 2>/dev/null || break; sleep 1; done
            kill $pid 2>/dev/null || true
            xcrun simctl terminate "$UDID" com.huseyingulcu.hop 2>/dev/null || true
            local line=$(grep -a "PPBENCH" "results/$label.log" | tail -1 | sed 's/.*PPBENCH //')
            if [ -n "$line" ]; then
              echo "$line" > "results/$label.json"
              echo "::notice title=bench-$label::$line"
            else
              echo "::warning title=bench-$label::no result"
              grep -a "PPSTAGE" "results/$label.log" | head -12 | while read -r l; do echo "::warning title=stage::$l"; done
              tail -20 "results/$label.log" | while read -r l; do echo "::warning::$l"; done
            fi
          }
          run optimized-1
          run finish-1 -finishtest

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p results
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/Hop* 2>/dev/null | head -3); do
            cp "$f" results/ || true
            python3 - "$f" <<'PY' || true
          import json, sys
          path = sys.argv[1]
          text = open(path).read()
          parts = text.split("\n", 1)
          body = json.loads(parts[1]) if len(parts) > 1 else {}
          exc = body.get("exception", {})
          print(f"::warning title=crash::{exc.get('type')} {exc.get('signal')} {body.get('termination', {}).get('indicator', '')}")
          images = body.get("usedImages", [])
          for thread in body.get("threads", []):
              if not thread.get("triggered"):
                  continue
              for frame in thread.get("frames", [])[:25]:
                  image = images[frame.get("imageIndex", 0)].get("name", "?") if images else "?"
                  print(f"::warning title=frame::{image} {frame.get('symbol', '?')} +{frame.get('symbolLocation', 0)}")
          PY
          done

      - name: Publish results to bench-results branch
        if: always()
        run: |
          cd results
          git init -q
          git config user.name "Hüseyin Gülcü"
          git config user.email "huseyinglc0@gmail.com"
          git add -A
          git commit -q -m "Benchmark results for ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:bench-results

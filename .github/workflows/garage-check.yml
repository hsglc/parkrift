name: Garage check

# Builds the app for the simulator and takes a screenshot of every garage car in the game's own
# renderer, to check car models and materials before they go to TestFlight.
on:
  workflow_dispatch:
    inputs:
      unlock:
        description: "Only the unlock reveal (a burst of screenshots)"
        default: "false"

jobs:
  garage:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"

      - name: Build for simulator
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Hop.xcodeproj -scheme Hop -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO SWIFT_ACTIVE_COMPILATION_CONDITIONS=BENCHMARK build > build.log 2>&1 || {
              grep -E "error:" build.log | head -40 | while read -r line; do echo "::error::$line"; done
              exit 1
            }

      - name: Garage screenshots
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = ""
          for runtime, devices in data.items():
              if "iOS" in runtime:
                  for d in devices:
                      if d["name"].startswith("iPhone") and "Pro Max" in d["name"]:
                          best = d["udid"]
          print(best)
          ')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/Hop.app
          mkdir -p garage
          if [ "${{ inputs.unlock }}" = "true" ]; then
            for CAR in 5 0; do
              xcrun simctl terminate "$UDID" com.huseyingulcu.hop 2>/dev/null || true
              sleep 2
              xcrun simctl launch "$UDID" com.huseyingulcu.hop -benchmark -staygarage -unlocktest -pp.car $CAR -pp.paint 0 -AppleLanguages "(tr)" > /dev/null 2>&1
              # The app saves frames of the reveal itself (unlock-*.png in its Documents)
              sleep 30
              DATA=$(xcrun simctl get_app_container "$UDID" com.huseyingulcu.hop data)
              for F in "$DATA"/Documents/unlock-*.png; do cp "$F" "garage/car$CAR-$(basename "$F")"; done
              rm -f "$DATA"/Documents/unlock-*.png
            done
            ls -la garage
            exit 0
          fi
          # Car raw values: italia 0, strada 3, toro 4, arrow 5, bison 6, classico 7; paints 0 red, 1 blue, 6 white
          for CAR in 0 3 4 5 6 7; do
            for PAINT in 0 1; do
              xcrun simctl terminate "$UDID" com.huseyingulcu.hop 2>/dev/null || true
              sleep 2
              xcrun simctl launch "$UDID" com.huseyingulcu.hop -benchmark -staygarage -pp.car $CAR -pp.paint $PAINT -AppleLanguages "(tr)" > /dev/null 2>&1
              sleep 9
              DATA=$(xcrun simctl get_app_container "$UDID" com.huseyingulcu.hop data)
              cp "$DATA/Documents/garage-shot.png" "garage/car$CAR-paint$PAINT.png" 2>/dev/null || true
              rm -f "$DATA/Documents/garage-shot.png"
            done
          done
          ls -la garage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: garage
          path: garage

name: App Store release

# Screenshots from the simulator, store texts, Game Center leaderboards, the latest TestFlight
# build, and (with submit) the submission for App Review. Runs on a push to the `release` branch
# or by hand.
on:
  workflow_dispatch:
    inputs:
      submit:
        description: Submit for App Review (1 = yes)
        default: "1"
      phone:
        description: App Review contact phone (when the REVIEW_PHONE secret is not set)
        default: ""
      shots:
        description: Take new screenshots (0 = keep the ones already uploaded)
        default: "1"
  push:
    branches: [release]

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 50
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || '668Y8934S8' }}
      ASC_ISSUER_ID: 1e043955-17da-4831-838a-b4e2d593d0b5
      BUNDLE_ID: com.huseyingulcu.hop
      SUBMIT: ${{ inputs.submit || '1' }}
      REVIEW_PHONE: ${{ secrets.REVIEW_PHONE || inputs.phone }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"

      - name: Build for simulator
        if: inputs.shots != '0'
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Hop.xcodeproj -scheme Hop -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO SWIFT_ACTIVE_COMPILATION_CONDITIONS=BENCHMARK build > build.log 2>&1 || {
              grep -E "error:" build.log | head -40 | while read -r line; do echo "::error::$line"; done
              exit 1
            }

      - name: Screenshots (6.9-inch iPhone)
        if: inputs.shots != '0'
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = ""
          for runtime, devices in data.items():
              if "iOS" in runtime:
                  for d in devices:
                      if d["name"].startswith("iPhone") and "Pro Max" in d["name"]:
                          best = d["udid"]
          print(best)
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
          xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/Hop.app
          mkdir -p raw shots
          # Each store language gets the game in that language
          for LANG in en tr es; do
          mkdir -p "raw/$LANG"
          ARGS="-AppleLanguages ($LANG) -AppleLocale $LANG"
          shoot() {
            local label=$1; shift
            xcrun simctl terminate "$UDID" com.huseyingulcu.hop 2>/dev/null || true
            sleep 2
            DATA=$(xcrun simctl get_app_container "$UDID" com.huseyingulcu.hop data 2>/dev/null || echo "")
            [ -n "$DATA" ] && rm -f "$DATA/Documents/bench.json"
            xcrun simctl launch --console-pty "$UDID" com.huseyingulcu.hop -benchmark "$@" $ARGS > "raw/$LANG/$label.log" 2>&1 &
            local pid=$!
            DATA=$(xcrun simctl get_app_container "$UDID" com.huseyingulcu.hop data)
            for i in $(seq 1 90); do [ -f "$DATA/Documents/bench.json" ] && break; sleep 1; done
            for f in shot-hud shot-finish; do
              cp "$DATA/Documents/$f.png" "raw/$LANG/$label-$f.png" 2>/dev/null || true
            done
            kill $pid 2>/dev/null || true
          }
          # Menu screens straight from the simulator's screen (the app's own snapshot misses
          # materials and the 3D garage)
          still() {
            local label=$1 wait=$2; shift 2
            xcrun simctl terminate "$UDID" com.huseyingulcu.hop 2>/dev/null || true
            sleep 2
            xcrun simctl launch "$UDID" com.huseyingulcu.hop -benchmark "$@" $ARGS > /dev/null 2>&1
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot --mask=ignored "raw/$LANG/$label.png" || true
          }
          shoot city
          shoot finish -finishtest
          still home 9 -staymenu
          still garage 12 -staygarage
          still levels 9 -staylevels
          done
          pip3 install --break-system-packages pillow pyjwt cryptography requests >/dev/null 2>&1 || pip3 install pillow pyjwt cryptography requests
          # Real game screens framed with a short caption per language (tools/store_shots.py)
          python3 tools/store_shots.py raw shots 2868 1320
          ls -R shots | head -30

      - uses: actions/upload-artifact@v4
        if: inputs.shots != '0'
        with:
          name: screenshots
          path: shots

      - name: Write key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/key.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/key.p8" >> "$GITHUB_ENV"

      - name: App Store Connect
        run: SHOTS=shots python3 tools/asc_release.py

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

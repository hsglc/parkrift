name: Countdown check

# Builds the app for the simulator and takes a burst of screenshots through a parking level's
# start countdown.
on:
  workflow_dispatch:
    inputs:
      screens:
        description: "Screenshot runs"
        default: "true"
      net:
        description: "Online check with two simulators"
        default: "true"

jobs:
  countdown:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"

      - name: Build for simulator
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Hop.xcodeproj -scheme Hop -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO SWIFT_ACTIVE_COMPILATION_CONDITIONS=BENCHMARK build > build.log 2>&1 || {
              grep -E "error:" build.log | head -40 | while read -r line; do echo "::error::$line"; done
              exit 1
            }

      - name: Countdown screenshots
        if: ${{ inputs.screens != 'false' }}
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = ""
          for runtime, devices in data.items():
              if "iOS" in runtime:
                  for d in devices:
                      if d["name"].startswith("iPhone") and "Pro Max" in d["name"]:
                          best = d["udid"]
          print(best)
          ')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/Hop.app
          mkdir -p shots
          rm -f ~/Library/Logs/DiagnosticReports/Hop* 2>/dev/null || true
          DATA=""
          for RUN in "daily" "venues" "fail" "card" "-parklevel 2" "streets" "city"; do
            xcrun simctl terminate "$UDID" com.huseyingulcu.hop 2>/dev/null || true
            sleep 2
            if [ "$RUN" = "daily" ]; then
              xcrun simctl launch "$UDID" com.huseyingulcu.hop -benchmark -staydaily -showsplash -AppleLanguages "(tr)" > /dev/null 2>&1
              sleep 1.4
              xcrun simctl io "$UDID" screenshot shots/splash.png || true
              sleep 7.6
              xcrun simctl io "$UDID" screenshot shots/daily.png || true
              continue
            elif [ "$RUN" = "venues" ]; then
              # One level in each place: rooftop, mall, harbour, yard
              for L in 3 6 9 12; do
                xcrun simctl terminate "$UDID" com.huseyingulcu.hop 2>/dev/null || true
                sleep 2
                DATA=$(xcrun simctl get_app_container "$UDID" com.huseyingulcu.hop data)
                rm -f "$DATA/Documents/shot-start.png"
                for TRY in 1 2; do
                  xcrun simctl launch "$UDID" com.huseyingulcu.hop -benchmark -playpark -parklevel $L -AppleLanguages "(tr)" > /dev/null 2>&1
                  for i in $(seq 1 30); do
                    [ -f "$DATA/Documents/shot-start.png" ] && break
                    sleep 2
                  done
                  [ -f "$DATA/Documents/shot-start.png" ] && break
                  # Still on the menu (a slow first launch): once more
                  xcrun simctl terminate "$UDID" com.huseyingulcu.hop 2>/dev/null || true
                  sleep 2
                done
                sleep 3
                xcrun simctl io "$UDID" screenshot "shots/venue-$L.png" || true
                cp "$DATA/Documents/shot-start.png" "shots/venue-$L-3d.png" 2>/dev/null || true
              done
              continue
            elif [ "$RUN" = "fail" ]; then
              # A park level failed on purpose: the result card in its failed state
              xcrun simctl launch "$UDID" com.huseyingulcu.hop -benchmark -playpark -parklevel 3 -failtest -AppleLanguages "(tr)" > /dev/null 2>&1
              # The app saves shot-fail.png once the card is up; the screen is taken then
              DATA=$(xcrun simctl get_app_container "$UDID" com.huseyingulcu.hop data)
              for i in $(seq 1 40); do
                [ -f "$DATA/Documents/shot-fail.png" ] && break
                sleep 2
              done
              sleep 1
              xcrun simctl io "$UDID" screenshot shots/fail.png || true
              cp "$DATA/Documents/shot-fail.png" shots/ 2>/dev/null || true
              continue
            elif [ "$RUN" = "card" ]; then
              # The last card of a match won after failing the last round
              xcrun simctl launch "$UDID" com.huseyingulcu.hop -benchmark -playpark -parklevel 3 -cardtest -AppleLanguages "(tr)" > /dev/null 2>&1
              DATA=$(xcrun simctl get_app_container "$UDID" com.huseyingulcu.hop data)
              for i in $(seq 1 40); do
                [ -f "$DATA/Documents/shot-card.png" ] && break
                sleep 2
              done
              sleep 1
              xcrun simctl io "$UDID" screenshot shots/card.png || true
              cp "$DATA/Documents/shot-card.png" shots/ 2>/dev/null || true
              continue
            elif [ "$RUN" = "streets" ]; then
              xcrun simctl launch --console-pty "$UDID" com.huseyingulcu.hop -benchmark -playcity -pedtest -policetest -dayweather -AppleLanguages "(tr)" > shots/streets-console.log 2>&1 &
              # Screens once the police banner is up (the app marks it), however slow the runner
              sleep 4
              DATA=$(xcrun simctl get_app_container "$UDID" com.huseyingulcu.hop data)
              for i in $(seq 1 45); do
                [ -f "$DATA/Documents/shot-police.png" ] && break
                sleep 2
              done
              xcrun simctl io "$UDID" screenshot shots/streets-1.png || true
              sleep 4
              xcrun simctl io "$UDID" screenshot shots/streets-2.png || true
              # Then the police catches the standing car: the busted scene
              for i in $(seq 1 20); do
                [ -f "$DATA/Documents/shot-busted.png" ] && break
                sleep 2
              done
              xcrun simctl io "$UDID" screenshot shots/busted.png || true
              sleep 2
              xcrun simctl io "$UDID" screenshot shots/busted-2.png || true
              # What every thread is doing (shows a hang, if there is one)
              PID=$(pgrep -x Hop | head -1); [ -n "$PID" ] && sample "$PID" 2 -file shots/sample-streets.txt > /dev/null 2>&1 || true
            elif [ "$RUN" = "city" ]; then
              xcrun simctl launch --console-pty "$UDID" com.huseyingulcu.hop -benchmark -finishtest -dayweather -AppleLanguages "(tr)" > shots/city-console.log 2>&1 &
            else
              xcrun simctl launch "$UDID" com.huseyingulcu.hop -benchmark -playpark $RUN -slowcountdown -AppleLanguages "(tr)" > /dev/null 2>&1
            fi
            sleep 50
            PID=$(pgrep -x Hop | head -1); [ -n "$PID" ] && sample "$PID" 2 -file "shots/sample-${RUN// /}.txt" > /dev/null 2>&1 || true
            DATA=$(xcrun simctl get_app_container "$UDID" com.huseyingulcu.hop data)
            cp "$DATA"/Documents/countdown-*.png "$DATA"/Documents/shot-*.png "$DATA"/Documents/scene-*.png shots/ 2>/dev/null || true
          done
          cp ~/Library/Logs/DiagnosticReports/Hop* shots/ 2>/dev/null || true
          ls shots | wc -l

      - name: Online check (two simulators in one room)
        if: ${{ inputs.net != 'false' }}
        timeout-minutes: 12
        run: |
          mkdir -p shots
          read A B <<< $(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          phones = []
          for runtime, devices in data.items():
              if "iOS" in runtime:
                  phones = [d["udid"] for d in devices if d["name"].startswith("iPhone") and "Pro" in d["name"]] or phones
          print(phones[-1], phones[-2])
          ')
          echo "host $A guest $B"
          for D in $A $B; do
            echo "boot $D"
            xcrun simctl boot "$D" 2>/dev/null || true
            timeout 240 xcrun simctl bootstatus "$D" -b > /dev/null || echo "bootstatus timed out"
            xcrun simctl install "$D" build/Build/Products/Release-iphonesimulator/Hop.app
            xcrun simctl terminate "$D" com.huseyingulcu.hop 2>/dev/null || true
            echo "ready $D"
          done
          CODE=$(python3 -c 'import random; print("".join(random.choice("BCDFGHJKLMNPQRSTVWXZ") for _ in range(4)))')
          echo "room $CODE"
          xcrun simctl launch --console-pty "$A" com.huseyingulcu.hop -benchmark -nethost $CODE -dayweather -AppleLanguages "(tr)" > shots/net-host.log 2>&1 &
          sleep 8
          xcrun simctl launch --console-pty "$B" com.huseyingulcu.hop -benchmark -netjoin $CODE -dayweather -AppleLanguages "(tr)" > shots/net-guest.log 2>&1 &
          for t in 30 45 60 75; do
            sleep 15
            xcrun simctl io "$A" screenshot "shots/net-host-$t.png" || true
            xcrun simctl io "$B" screenshot "shots/net-guest-$t.png" || true
          done
          # The apps hold the console: close them so the step ends
          xcrun simctl terminate "$A" com.huseyingulcu.hop 2>/dev/null || true
          xcrun simctl terminate "$B" com.huseyingulcu.hop 2>/dev/null || true
          sleep 2
          kill %1 %2 2>/dev/null || true
          echo "--- host"; grep -a "PPNET" shots/net-host.log | head -40
          echo "--- guest"; grep -a "PPNET" shots/net-guest.log | head -40
          grep -a "PPNET hit" shots/net-*.log | while read -r line; do echo "::notice::$line"; done || true
          cp ~/Library/Logs/DiagnosticReports/Hop* shots/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: countdown
          path: shots

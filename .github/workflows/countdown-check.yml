name: Countdown check

# Builds the app for the simulator and takes a burst of screenshots through a parking level's
# start countdown.
on:
  workflow_dispatch:

jobs:
  countdown:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"

      - name: Build for simulator
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Hop.xcodeproj -scheme Hop -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO SWIFT_ACTIVE_COMPILATION_CONDITIONS=BENCHMARK build > build.log 2>&1 || {
              grep -E "error:" build.log | head -40 | while read -r line; do echo "::error::$line"; done
              exit 1
            }

      - name: Countdown screenshots
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = ""
          for runtime, devices in data.items():
              if "iOS" in runtime:
                  for d in devices:
                      if d["name"].startswith("iPhone") and "Pro Max" in d["name"]:
                          best = d["udid"]
          print(best)
          ')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/Hop.app
          mkdir -p shots
          rm -f ~/Library/Logs/DiagnosticReports/Hop* 2>/dev/null || true
          DATA=""
          for RUN in "daily" "-parklevel 2" "streets" "city"; do
            xcrun simctl terminate "$UDID" com.huseyingulcu.hop 2>/dev/null || true
            sleep 2
            if [ "$RUN" = "daily" ]; then
              xcrun simctl launch "$UDID" com.huseyingulcu.hop -benchmark -staydaily -AppleLanguages "(tr)" > /dev/null 2>&1
              sleep 9
              xcrun simctl io "$UDID" screenshot shots/daily.png || true
              continue
            elif [ "$RUN" = "streets" ]; then
              xcrun simctl launch --console-pty "$UDID" com.huseyingulcu.hop -benchmark -playcity -pedtest -dayweather -AppleLanguages "(tr)" > shots/streets-console.log 2>&1 &
              sleep 11
              xcrun simctl io "$UDID" screenshot shots/streets-1.png || true
              sleep 8
              xcrun simctl io "$UDID" screenshot shots/streets-2.png || true
            elif [ "$RUN" = "city" ]; then
              xcrun simctl launch --console-pty "$UDID" com.huseyingulcu.hop -benchmark -finishtest -dayweather -AppleLanguages "(tr)" > shots/city-console.log 2>&1 &
            else
              xcrun simctl launch "$UDID" com.huseyingulcu.hop -benchmark -playpark $RUN -slowcountdown -AppleLanguages "(tr)" > /dev/null 2>&1
            fi
            sleep 50
            DATA=$(xcrun simctl get_app_container "$UDID" com.huseyingulcu.hop data)
            cp "$DATA"/Documents/countdown-*.png "$DATA"/Documents/shot-*.png "$DATA"/Documents/scene-*.png shots/ 2>/dev/null || true
          done
          cp ~/Library/Logs/DiagnosticReports/Hop* shots/ 2>/dev/null || true
          ls shots | wc -l

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: countdown
          path: shots

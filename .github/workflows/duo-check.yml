name: iPhone Duo check

# Builds with Xcode 27.1 and takes screenshots on the iPhone Duo simulator (inner and, when the
# simulator can fold, outer display) to check the layout before App Store submission.
on:
  workflow_dispatch:

jobs:
  duo:
    runs-on: xcode-27
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          xcrun simctl help 2>&1 | grep -i -E "fold|posture|display|hinge" || true
          xcrun simctl io help 2>&1 | head -60 || true
      - name: Build for simulator
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Hop.xcodeproj -scheme Hop -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO SWIFT_ACTIVE_COMPILATION_CONDITIONS=BENCHMARK build > build.log 2>&1 || {
              grep -E "error:" build.log | head -40 | while read -r line; do echo "::error::$line"; done
              exit 1
            }
          grep -E "warning:.*(deprecated|Duo|reserved)" build.log | head -20 || true
      - name: Screens on iPhone Duo and iPhone Pro Max
        run: |
          RUNTIME=$(xcrun simctl list runtimes | grep -o 'com.apple.CoreSimulator.SimRuntime.iOS-27-1' | head -1)
          mkdir -p duo
          for DEV in iPhone-Duo iPhone-18-Pro-Max; do
            UDID=$(xcrun simctl create "$DEV" "com.apple.CoreSimulator.SimDeviceType.$DEV" "$RUNTIME")
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/Hop.app
            # The Duo has two displays: try the plain call, then each display by name
            shot() {
              local out=$1
              xcrun simctl io "$UDID" screenshot --mask=ignored "$out" 2>/dev/null && return
              for d in internal external main inner outer 0 1; do
                xcrun simctl io "$UDID" screenshot --display="$d" --mask=ignored "${out%.png}-$d.png" 2>/dev/null && echo "display $d ok"
              done
              true
            }
            still() {
              local label=$1 wait=$2; shift 2
              xcrun simctl terminate "$UDID" com.huseyingulcu.hop 2>/dev/null || true
              sleep 2
              xcrun simctl launch "$UDID" com.huseyingulcu.hop -benchmark "$@" > /dev/null 2>&1
              sleep "$wait"
              shot "duo/$DEV-$label.png"
            }
            still home 9 -staymenu
            still levels 9 -staylevels
            still garage 12 -staygarage
            still loading 3.4 -playpark
            still park 11 -playpark
            xcrun simctl terminate "$UDID" com.huseyingulcu.hop 2>/dev/null || true
            sleep 2
            xcrun simctl launch "$UDID" com.huseyingulcu.hop -benchmark > /dev/null 2>&1
            sleep 22; shot "duo/$DEV-race1.png"
            sleep 10; shot "duo/$DEV-race2.png"
            xcrun simctl shutdown "$UDID" || true
          done
          ls -la duo
      - uses: actions/upload-artifact@v4
        with:
          name: duo
          path: duo

name: Crash test

# Builds the app for the simulator and runs the automated navigation test (-crashtest): every way
# in and out of the game, reversing, quitting mid-loading/countdown/race, three rounds. Collects
# the step log, memory samples and any crash report.
on:
  workflow_dispatch:

jobs:
  crash:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"

      - name: Build for simulator
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Hop.xcodeproj -scheme Hop -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || {
              grep -E "error:" build.log | head -40 | while read -r line; do echo "::error::$line"; done
              exit 1
            }

      - name: Run the navigation test
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = ""
          for runtime, devices in data.items():
              if "iOS" in runtime:
                  for d in devices:
                      if d["name"].startswith("iPhone") and "Pro Max" in d["name"]:
                          best = d["udid"]
          print(best)
          ')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/Hop.app
          mkdir -p out
          rm -f ~/Library/Logs/DiagnosticReports/Hop* 2>/dev/null || true
          xcrun simctl launch --console-pty "$UDID" com.huseyingulcu.hop -crashtest -AppleLanguages "(tr)" > out/console.log 2>&1 &
          sleep 5
          for i in $(seq 1 100); do
            PID=$(pgrep -f "Hop.app/Hop" | head -1)
            if [ -z "$PID" ]; then echo "$(date +%T) app not running" >> out/memory.log; break; fi
            echo "$(date +%T) $(footprint -p $PID 2>/dev/null | grep -E 'phys_footprint:|Footprint' | head -1)" >> out/memory.log
            DATA=$(xcrun simctl get_app_container "$UDID" com.huseyingulcu.hop data 2>/dev/null)
            if grep -q "^done" "$DATA/Documents/crashtest.txt" 2>/dev/null; then echo "finished" >> out/memory.log; break; fi
            sleep 3
          done
          DATA=$(xcrun simctl get_app_container "$UDID" com.huseyingulcu.hop data 2>/dev/null)
          cp "$DATA/Documents/crashtest.txt" out/ 2>/dev/null || true
          sleep 5
          cp ~/Library/Logs/DiagnosticReports/Hop* out/ 2>/dev/null || true
          ls -la out
          echo "--- last steps"; tail -5 out/crashtest.txt || true
          echo "--- memory"; tail -40 out/memory.log
          if ls out/Hop* >/dev/null 2>&1; then echo "::error::The app crashed"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crash-test
          path: out

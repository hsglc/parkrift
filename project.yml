name: Hop
options:
  bundleIdPrefix: com.huseyingulcu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 155.0.0

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  Hop:
    type: application
    platform: iOS
    sources:
      - path: Hop
    dependencies:
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huseyingulcu.hop
        PRODUCT_NAME: Hop
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Support/Hop.entitlements
        ENABLE_PREVIEWS: NO
    scheme: {}
